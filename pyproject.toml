[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibevoice"
version = "0.1.0"
authors = [
  { name="vibevoice team", email="vibepod@microsoft.com" },
]
description = "A model for speech generation with an AR + diffusion architecture."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch",
    "accelerate==1.6.0",
    "transformers==4.51.3",
    "datasets==3.5.0",
    "peft",
    "llvmlite>=0.40.0",
    "numba>=0.57.0",
    "diffusers",
    "tqdm",
    "numpy",
    "scipy",
    "librosa",
    "ml-collections",
    "absl-py",
    "gradio==5.50.0",
    "av",
    "aiortc"
]

[project.optional-dependencies]
streaming-web = [
    "fastapi",
    "uvicorn[standard]",
]
stickman-service = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.7",
    "httpx==0.28.1",
]
stickman-test = [
    "pytest==8.4.1",
]

[project.scripts]
stickman-vibevoice-service = "stickman_service.__main__:main"

[project.urls]
Homepage = "https://github.com/Iskanderrus/VibeVoice"
"Upstream Community Source" = "https://github.com/vibevoice-community/VibeVoice"
"Stickman Integration" = "https://github.com/Iskanderrus/VibeVoice/blob/main/STICKMAN_SERVICE.md"

[tool.setuptools.packages.find]
where = ["."]
